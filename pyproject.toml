[project]
name = "conceptflow"
version = "0.1.0"
description = "Open-source, self-hostable educational video generation system in the style of 3Blue1Brown."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.6.8",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.4",
    "langchain-google-genai>=4.2.4",
    "langchain-modal>=0.0.5",
    "langchain-openai>=1.2.2",
    "langgraph-cli[inmem]>=0.4.30",
    "modal>=1.4.3",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "ty>=0.0.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conceptflow"]

[tool.ruff]
exclude = []
line-length = 100
target-version = "py314"

[tool.ruff.format]
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PT"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: tests requiring a live sandbox or sandbox-only packages (skipped by default)",
]
addopts = "-m 'not integration'"

